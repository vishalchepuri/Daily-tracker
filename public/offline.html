<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020817" />
    <title>Dayza Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #020817;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(88vw, 26rem);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        padding: 24px;
        background: rgba(15, 23, 42, 0.82);
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0; color: #93a4bc; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Dayza is offline</h1>
      <p>Please reconnect to load live chats, workouts, spends, nutrition, and reminders.</p>
    </main>
  </body>
</html>
